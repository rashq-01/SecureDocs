version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: securedocs-rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: securedocs
      RABBITMQ_DEFAULT_PASS: securedocs_pass
    networks:
      - securedocs-network

  redis:
    image: redis:7-alpine
    container_name: securedocs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - securedocs-network

networks:
  securedocs-network:
    driver: bridge

volumes:
  redis_data: